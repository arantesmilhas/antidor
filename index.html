<style>
  :root{
    --green:#16a34a;
    --green-dark:#0e9542;
    --green-hover:#2eac5c;
    --green-bg:rgba(22,163,74,.1);
    --green-border:rgba(22,163,74,.45);
    --red:#dc2626;
    --text:#09090b;
    --sub:#52525b;
    --card-border:#e5e7eb;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:#fff;color:var(--text);
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;}
  button{font-family:inherit;}
  img{max-width:100%;display:block;}
  a{color:inherit;text-decoration:none;}

  #app{width:100%;max-width:28rem;margin:0 auto;padding:1rem .75rem 2.5rem;min-height:100svh;}

  /* ---- Hook screen (step 1) ---- */
  .hook-page{display:flex;flex-direction:column;gap:1rem;padding-top:.5rem;}
  .hook-headline{margin:0;text-align:center;font-size:1.35rem;line-height:1.35;font-weight:700;}
  .hook-headline .tag-urgent{color:#fff;background:var(--text);padding:0 .2em;}
  .hook-headline .hl-green{color:var(--green);}
  .hook-headline .hl-underline{text-decoration:underline;}
  .hook-sub{margin:0;text-align:center;font-size:1rem;line-height:1.5;color:var(--sub);}
  .hook-img{width:100%;border-radius:1rem;overflow:hidden;}

  /* ---- Header (quiz screens) ---- */
  .qheader{position:relative;display:flex;flex-direction:column;align-items:center;padding-bottom:1rem;}
  .back-btn{position:absolute;left:0;top:.15rem;background:none;border:none;font-size:1.4rem;line-height:1;cursor:pointer;color:var(--text);padding:.25rem;}
  .qlogo{height:62px;margin-bottom:.6rem;}
  .progress-track{width:100%;height:8px;border-radius:999px;background:var(--green-bg);overflow:hidden;}
  .progress-fill{height:100%;background:var(--green);border-radius:999px;transition:width .6s ease;}

  .q-title{font-size:1.3rem;font-weight:800;text-align:center;margin:1.1rem 0 .4rem;line-height:1.3;text-wrap:balance;}
  .q-title .hl-green{color:var(--green);}
  .q-title .hl-red{color:var(--red);}
  .q-sub{font-size:.9rem;color:var(--sub);text-align:center;margin:0 0 1.2rem;line-height:1.4;}

  .options{display:flex;flex-direction:column;gap:.75rem;margin-bottom:1rem;}

  .opt-solid{background:var(--green);color:#fff;border:none;border-radius:1rem;
    padding:1rem 1.25rem;font-weight:600;font-size:.95rem;text-align:center;cursor:pointer;
    box-shadow:0 4px 0 var(--green-dark);transition:transform .12s ease;}
  .opt-solid:hover{background:var(--green-hover);}
  .opt-solid:active{transform:translateY(3px);box-shadow:0 1px 0 var(--green-dark);}

  .opt-outline{background:var(--green-bg);border:1px solid var(--green-border);border-radius:1rem;
    padding:.9rem 1rem;display:flex;justify-content:space-between;align-items:center;gap:.75rem;
    text-align:left;cursor:pointer;font-size:.95rem;width:100%;color:var(--text);}
  .opt-outline .chev{width:1.7rem;height:1.7rem;border:1px solid var(--green);border-radius:999px;
    display:flex;align-items:center;justify-content:center;color:var(--green);flex-shrink:0;font-size:1rem;}

  .opt-checkbox{background:var(--green-bg);border:1px solid var(--green-border);border-radius:1rem;
    padding:.9rem 1rem;display:flex;justify-content:space-between;align-items:center;cursor:pointer;
    font-size:.95rem;width:100%;color:var(--text);}
  .opt-checkbox .box{width:1.3rem;height:1.3rem;border:1px solid var(--green);border-radius:.4rem;
    flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:.85rem;}
  .opt-checkbox.selected .box{background:var(--green);}

  .btn-continue{background:var(--green);color:#fff;border:none;border-radius:1rem;padding:1.05rem;
    font-weight:700;text-align:center;cursor:pointer;box-shadow:0 4px 0 var(--green-dark);width:100%;
    font-size:1rem;display:block;transition:transform .12s ease;}
  .btn-continue:hover{background:var(--green-hover);}
  .btn-continue:active{transform:translateY(3px);box-shadow:0 1px 0 var(--green-dark);}

  /* ---- Gender cards (step 2) ---- */
  .gender-grid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;}
  .gender-card{border:1px solid var(--card-border);border-radius:1rem;overflow:hidden;background:#fff;cursor:pointer;padding:0;}
  .gender-card img{width:100%;aspect-ratio:1/1;object-fit:cover;}
  .gender-card .label{display:flex;align-items:center;justify-content:space-between;padding:.65rem .8rem;font-size:.9rem;font-weight:500;}
  .gender-card .label .chev{color:var(--green);font-size:1.1rem;}

  /* ---- Fake news article (step 9) — agora é uma imagem única, ver renderArticle ---- */
  .article-card{border:1px solid var(--card-border);border-radius:1rem;overflow:hidden;margin-bottom:1.2rem;}



  /* ---- Audio widget (réplica exata do componente "whatsapp" do site original,
     medida via DOM ao vivo: fundo #efeae2, bolha branca com rabinho reto no
     topo-esquerda, play sem círculo de fundo, barras cinza + bolinha azul,
     selo de microfone azul embaixo-à-esquerda do avatar) ---- */
  .wa-bg{position:relative;background:#efeae2;border-radius:.75rem;padding:1.25rem 1rem;
    overflow:hidden;margin-bottom:1.1rem;}
  .wa-bg-pattern{position:absolute;inset:0;
    background-image:url('images/bg-whatsapp.png');
    background-repeat:repeat;opacity:.5;pointer-events:none;}
  .wa-bubble{position:relative;background:#fff;border-radius:0 .75rem .75rem .75rem;
    box-shadow:0 1px .5px rgba(0,0,0,.13);padding:.55rem .8rem .55rem 1rem;
    display:flex;align-items:center;gap:.7rem;color:#9b8e8d;}
  .wa-tail{position:absolute;top:0;right:100%;width:8px;height:13px;}
  .wa-tail svg{display:block;width:100%;height:100%;fill:#fff;}
  .wa-play{background:none;border:none;padding:0;cursor:pointer;color:#9b8e8d;
    width:1.25rem;height:1.25rem;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .wa-play:hover{color:#8b7e7e;}
  .wa-play svg{width:100%;height:100%;}
  .wa-mid{flex:1;min-width:0;position:relative;padding-bottom:1rem;}
  .wa-bars{display:flex;align-items:center;justify-content:space-between;height:24px;position:relative;width:100%;}
  .wa-bars span{width:4px;border-radius:4px;background:#ced0d1;flex-shrink:0;transition:height .25s ease,background-color .15s linear;}
  .wa-bars span.wa-played{background:#858a8d;}
  .wa-dot{position:absolute;left:0;top:2px;width:1rem;height:1rem;border-radius:999px;background:#50c2f7;
    transition:left .1s linear;pointer-events:none;}
  .wa-time{position:absolute;left:1px;bottom:0;font-size:.7rem;color:#8696a0;}
  .wa-avatar-wrap{position:relative;width:3.5rem;height:3.5rem;flex-shrink:0;}
  .wa-avatar-wrap img{width:100%;height:100%;border-radius:999px;object-fit:cover;display:block;}
  .wa-mic{position:absolute;bottom:-4px;left:-4px;width:1.5rem;height:2.05rem;color:#50c2f7;}
  .wa-mic svg{width:100%;height:100%;display:block;}

  /* ---- Real YouTube testimonial embed ---- */
  .video-embed{position:relative;border-radius:1rem;overflow:hidden;background:#000;aspect-ratio:9/16;
    max-height:70vh;margin-bottom:.3rem;}
  .video-embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
  .video-caption{text-align:center;font-weight:700;margin:.7rem 0 .1rem;font-size:1rem;}
  .video-subcaption{text-align:center;color:var(--sub);font-size:.85rem;margin:0 0 1.1rem;}

  /* ---- Alert banner (step 17) ---- */
  .alert-banner{background:var(--green);color:#fff;border-radius:1rem;padding:.9rem 1rem;margin-bottom:1.2rem;font-size:.9rem;line-height:1.4;}
  .alert-banner b{display:block;margin-bottom:.15rem;}
  .alert-banner u{text-decoration:underline;font-weight:600;}

  /* ---- Testimonial text card ---- */
  .testimonial{background:#fff;border:1px solid var(--card-border);border-radius:1rem;padding:1rem;
    display:flex;gap:.75rem;margin-bottom:1rem;}
  .testimonial img{width:3rem;height:3rem;border-radius:999px;object-fit:cover;flex-shrink:0;}
  .testimonial .name{font-weight:700;font-size:.95rem;}
  .testimonial .loc{font-size:.75rem;color:var(--sub);margin-bottom:.4rem;}
  .testimonial .quote{font-size:.88rem;color:#1f2937;line-height:1.45;}

  /* ---- WhatsApp carousel (step 23) ---- */
  .wa-carousel{position:relative;border-radius:1rem;overflow:hidden;margin-top:1.2rem;border:1px solid var(--card-border);}
  .wa-slide{display:none;}
  .wa-slide.active{display:block;}
  .wa-dots{display:flex;justify-content:center;gap:.4rem;margin-top:.6rem;}
  .wa-dots button{width:.5rem;height:.5rem;padding:0;border-radius:999px;background:#d1d5db;border:none;cursor:pointer;}
  .wa-dots button.active{background:var(--green);}

  /* ---- Loading screen (step 26) ---- */
  .loading-wrap{text-align:center;padding-top:2.5rem;}
  .loading-ring{width:9rem;height:9rem;border-radius:999px;margin:0 auto 1.5rem;position:relative;
    background:conic-gradient(var(--green) calc(var(--pct,0)*1%), var(--green-bg) 0);
    display:flex;align-items:center;justify-content:center;transition:background 1s linear;}
  .loading-ring::before{content:'';position:absolute;inset:.6rem;background:#fff;border-radius:999px;}
  .loading-pct{position:relative;font-size:1.8rem;font-weight:800;color:var(--text);}
  .loading-title{font-size:1.15rem;font-weight:700;margin:0 0 .4rem;}
  .loading-status{color:var(--sub);font-size:.9rem;}

  /* ---- Analysis / results screen (novo step, entre loading e offer) ---- */
  .slider-row{margin-bottom:.9rem;}
  .slider-row .slabel{display:flex;justify-content:space-between;font-size:.85rem;font-weight:600;gap:.5rem;}
  .slider-row .strack{height:6px;border-radius:999px;background:#e5e7eb;margin-top:.35rem;}
  .slider-row .sfill{height:100%;border-radius:999px;}
  .sfill.red{background:var(--red);}
  .sfill.green{background:var(--green);}
  .agent-name{text-align:center;color:var(--green);text-decoration:underline;font-style:italic;font-size:1.05rem;margin:.2rem 0 1rem;}

  /* ---- Offer page (step 27) ---- */
  .offer-page{display:flex;flex-direction:column;gap:1.1rem;}
  .offer-badge{display:inline-flex;align-self:center;background:var(--green-bg);color:var(--green-dark);
    font-weight:700;font-size:.8rem;padding:.4rem .8rem;border-radius:999px;}
  .offer-h1{text-align:center;font-size:1.5rem;font-weight:800;line-height:1.3;margin:0;text-wrap:balance;}
  .offer-p{text-align:center;font-size:.92rem;color:#1f2937;line-height:1.55;margin:0;}
  .offer-p em{color:var(--sub);font-style:italic;}
  .ba-grid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;}
  .ba-card{border:1px solid var(--card-border);border-radius:1rem;overflow:hidden;text-align:center;}
  .ba-card img{width:100%;aspect-ratio:1/1;object-fit:cover;}
  .ba-card .cap{padding:.7rem 0;font-weight:700;}
  .ba-note{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;text-align:center;font-size:.82rem;font-weight:600;}
  .attention-card{background:#f9fafb;border:1px solid var(--card-border);border-radius:1rem;padding:1.1rem;}
  .attention-card h3{margin:0 0 .6rem;font-size:1.1rem;}
  .attention-card p{font-size:.88rem;line-height:1.55;margin:0 0 .7rem;color:#1f2937;}
  .check-list{list-style:none;margin:0 0 .7rem;padding:0;display:flex;flex-direction:column;gap:.5rem;}
  .check-list li{font-size:.88rem;line-height:1.5;color:#1f2937;}
  .price-card{border:1px solid var(--card-border);border-radius:1.2rem;padding:1.1rem;}
  .price-items{list-style:none;margin:0 0 1rem;padding:0;display:flex;flex-direction:column;gap:.55rem;}
  .price-items li{display:flex;justify-content:space-between;gap:.5rem;font-size:.87rem;}
  .price-total{text-align:center;margin-bottom:.9rem;}
  .price-total .old{color:var(--sub);text-decoration:line-through;font-size:.85rem;display:block;}
  .price-total .lead{font-size:.85rem;color:var(--sub);}
  .price-total .big{font-size:2.1rem;font-weight:800;color:var(--green);}
  .price-perks{display:flex;flex-direction:column;gap:.5rem;margin-top:.9rem;font-size:.85rem;}
  .price-perks b{display:block;}
  .price-perks span{color:var(--sub);}
  .guarantee-banner{border-radius:1rem;overflow:hidden;}
  .weeks-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.6rem;}
  .weeks-list li{font-size:.9rem;line-height:1.5;padding-left:1.4rem;position:relative;}
  .weeks-list li::before{content:'✓';position:absolute;left:0;color:var(--green);font-weight:800;}
  .test180{text-align:center;background:var(--green-bg);border-radius:1rem;padding:1rem;}
  .test180 .t1{font-weight:800;font-size:1.1rem;color:var(--green-dark);}
  .test180 .t2{font-size:.8rem;color:var(--sub);margin-bottom:.5rem;}
  .test180 .t3{font-size:.85rem;color:var(--sub);}
  .test180 .t4{font-size:1.6rem;font-weight:800;margin-bottom:.7rem;}
  .bonus-label{text-align:center;font-size:.7rem;font-weight:700;letter-spacing:.05em;color:var(--green-dark);
    background:var(--green-bg);border-radius:999px;padding:.4rem .8rem;align-self:center;}
  .gift-card{border-radius:1rem;overflow:hidden;}
  .offer-final p{font-size:.92rem;line-height:1.6;color:#1f2937;margin:0 0 .7rem;}
  .risk-card{border-radius:1rem;overflow:hidden;}

  @media (min-width:480px){ #app{padding:1.5rem 1rem 3rem;} }
</style>

  /* Widget de áudio: réplica fiel do componente real (rabinho branco no
     topo-esquerda da bolha, botão play sem círculo, barras + bolinha azul,
     avatar com selo de microfone embaixo-à-esquerda).
     As barras começam com um desenho "esqueleto" e são substituídas pela
     forma REAL do áudio assim que o arquivo é decodificado (ver
     hydrateAudioWidgets / drawRealWaveform). A bolinha azul acompanha a
     reprodução via evento timeupdate do <audio> (ver toggleAudio). */
  var WA_BARS_COUNT = 30;
  function audioWidget(src, len){
    var bars = "";
    for(var i=0;i<WA_BARS_COUNT;i++){
      var h = 4 + Math.round(Math.abs(Math.sin(i*0.7))*20);
      bars += '<span style="height:'+h+'px"></span>';
    }
    return '' +
      '<div class="wa-bg"><div class="wa-bg-pattern"></div>' +
        '<div class="wa-bubble">' +
          '<span class="wa-tail"><svg viewBox="0 0 8 13"><path d="M8,0 L8,13 C3,13 0,9 0,4 C0,1 3,0 8,0 Z"/></svg></span>' +
          '<button class="wa-play" data-action="toggle-audio" data-src="'+src+'">' +
            '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>' +
          '</button>' +
          '<div class="wa-mid">' +
            '<div class="wa-bars" data-audio-src="'+src+'">'+bars+'<span class="wa-dot" style="left:0%"></span></div>' +
            '<div class="wa-time" data-role="audio-time" data-original-len="'+len+'">'+len+'</div>' +
          '</div>' +
          '<div class="wa-avatar-wrap">' +
            '<img src="'+IMG+'1kKGG-foto-de-perfil.png" alt="Especialista">' +
            '<span class="wa-mic"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg></span>' +
          '</div>' +
        '</div>' +
      '</div>';
  }

  /* Decodifica o mp3 de verdade via Web Audio API e devolve WA_BARS_COUNT
     valores normalizados (0 a 1) representando o volume real de cada trecho
     do áudio — a "forma" do desenho passa a ser a forma real do áudio. */
  var waveformCache = {};
  function decodeRealWaveform(src){
    if(waveformCache[src]) return waveformCache[src];
    waveformCache[src] = new Promise(function(resolve, reject){
      try{
        if(typeof fetch !== "function"){ reject(new Error("fetch indisponível neste ambiente")); return; }
        var Ctx = window.AudioContext || window.webkitAudioContext;
        if(!Ctx){ reject(new Error("AudioContext indisponível neste ambiente")); return; }
        fetch(src).then(function(r){ return r.arrayBuffer(); }).then(function(buf){
          var ctx = new Ctx();
          return ctx.decodeAudioData(buf).then(function(audioBuffer){
            if(ctx.close) ctx.close();
            return audioBuffer;
          });
        }).then(function(audioBuffer){
          var raw = audioBuffer.getChannelData(0);
          var blockSize = Math.max(1, Math.floor(raw.length / WA_BARS_COUNT));
          var peaks = [];
          for(var i=0;i<WA_BARS_COUNT;i++){
            var start = i*blockSize, sum = 0, count = 0;
            for(var j=0;j<blockSize && (start+j)<raw.length; j++){ sum += Math.abs(raw[start+j]); count++; }
            peaks.push(count ? (sum/count) : 0);
          }
          var max = Math.max.apply(null, peaks) || 1;
          resolve(peaks.map(function(p){ return Math.max(.12, p/max); }));
        }).catch(reject);
      }catch(err){ reject(err); }
    });
    return waveformCache[src];
  }

  /* Procura widgets de áudio ainda não hidratados dentro de root e troca as
     barras "esqueleto" pelas barras com a forma real do áudio. Falha
     silenciosamente (mantém o esqueleto) se o fetch/decode não rolar —
     por exemplo ao abrir o arquivo direto como file:// sem servidor. */
  function hydrateAudioWidgets(root){
    var containers = (root || document).querySelectorAll('.wa-bars[data-audio-src]:not([data-hydrated])');
    containers.forEach(function(container){
      container.setAttribute('data-hydrated', '1');
      var src = container.getAttribute('data-audio-src');
      decodeRealWaveform(src).then(function(peaks){
        var dot = container.querySelector('.wa-dot');
        container.querySelectorAll('span:not(.wa-dot)').forEach(function(span, i){
          if(peaks[i] != null) span.style.height = Math.round(4 + peaks[i]*20) + 'px';
        });
        if(dot) container.appendChild(dot); // garante que a bolinha fica por cima, no fim do desenho
      }).catch(function(){ /* mantém o desenho esqueleto */ });
    });
  }

  /* ---------------- Hook screen ---------------- */
  function renderHook(){
    return '<div class="hook-page">' +
      '<h1 class="hook-headline">' +
        '<span class="tag-urgent">URGENTE:</span> ' +
        '<span class="hl-green">TRUQUE NATURAL CASEIRO DE 9 DIAS ESTÁ TIRANDO AS DORES NAS ARTICULAÇÕES</span> ' +
        'E ELIMINANDO A <span class="hl-underline">INFLAMAÇÃO CAUSADA POR PARASITAS!</span>' +
      '</h1>' +
      '<p class="hook-sub">Pessoas com mais de 50 anos, estão se livrando de todas as dores articulares no corpo, voltando a correr, se agachar, subir escadas e a dormir melhor. Tudo graças a uma simples receita natural que elimina o parasita que corrói as articulações</p>' +
      '<div class="hook-img"><img src="'+IMG+'lg-2U0ef-fungo-350-x-350-px-video-para-facebook.png" alt="Imagem"></div>' +
      '<button class="btn-continue" data-action="start">QUERO APRENDER TAMBÉM !</button>' +
    '</div>';
  }

  /* ---------------- Main render ---------------- */
  function render(){
    var app = document.getElementById("app");
    window.scrollTo(0,0);

    if(current === -1){
      app.innerHTML = renderHook();
      return;
    }

    var step = STEPS[current];
    var body = "";

    if(step.type === "gender"){
      body += '<div class="q-title">'+step.title+'</div><div class="q-sub">'+step.sub+'</div>';
      body += '<div class="gender-grid">' + step.options.map(function(o,i){
        return '<button class="gender-card" data-action="choose" data-idx="'+i+'">' +
          '<img src="'+o.img+'" alt="'+o.label+'">' +
          '<div class="label">'+o.label+'<span class="chev">›</span></div></button>';
      }).join("") + '</div>';
    } else if(step.type === "image-choice"){
      var icImg = step.imageByGender ? step.imageByGender[userGender] : step.image;
      body += '<div style="border-radius:1rem;overflow:hidden;margin-bottom:1rem"><img src="'+icImg+'" alt="Imagem"></div>';
      body += '<div class="options">' + step.options.map(function(label,i){
        return '<button class="opt-solid" data-action="choose" data-idx="'+i+'">'+label+'</button>';
      }).join("") + '</div>';
    } else if(step.type === "choice"){
      body += '<div class="q-title">'+step.title+'</div>';
      if(step.sub) body += '<div class="q-sub">'+step.sub+'</div>';
      body += optionsHtml(step);
    } else if(step.type === "checkbox"){
      body += '<div class="q-title">'+step.title+'</div>';
      if(step.sub) body += '<div class="q-sub">'+step.sub+'</div>';
      body += checkboxHtml(step);
    } else if(step.type === "article"){
      body += renderArticle();
    } else if(step.type === "audio"){
      body += renderAudioStep(step);
    } else if(step.type === "commit"){
      body += '<div class="q-title">'+step.title+'</div>';
      if(step.sub) body += '<div class="q-sub">'+step.sub+'</div>';
      body += optionsHtml({options:step.options, style:"solid"});
      body += '<div class="wa-carousel" id="waCarousel">' +
        step.carousel.map(function(src,i){ return '<div class="wa-slide'+(i===0?' active':'')+'"><img src="'+src+'"></div>'; }).join("") +
        '</div>' +
        '<div class="wa-dots">' + step.carousel.map(function(_,i){ return '<button data-wa="'+i+'" class="'+(i===0?'active':'')+'"></button>'; }).join("") + '</div>';
    } else if(step.type === "loading"){
      body += renderLoading();
    } else if(step.type === "analysis"){
      body += renderAnalysis();
    } else if(step.type === "offer"){
      body += renderOffer();
    }

    var header = (step.type === "offer" || step.type === "analysis") ? renderHeaderNoProgress() : renderHeader(step);
    app.innerHTML = header + body;

    if(step.type === "loading") runLoading();
    if(step.type === "commit") wireCarousel();
    hydrateAudioWidgets(app);
  }

  function wireCarousel(){
    var wrap = document.getElementById("waCarousel");
    if(!wrap) return;
  }

  function runLoading(){
    var pct = 0;
    var ring = document.getElementById("loadRing");
    var pctEl = document.getElementById("loadPct");
    var statusEl = document.getElementById("loadStatus");
    var messages = ["Estamos analisando suas respostas","Montando protocolo personalizado","Gerando seu protocolo..."];
    var msgIdx = 0;
    var timer = setInterval(function(){
      pct += 4;
      if(pct > 100) pct = 100;
      if(ring) ring.style.setProperty("--pct", pct);
      if(pctEl) pctEl.textContent = pct + "%";
      if(pct % 33 === 0 && statusEl){ msgIdx = (msgIdx+1) % messages.length; statusEl.textContent = messages[msgIdx]; }
      if(pct >= 100){
        clearInterval(timer);
        setTimeout(function(){ current++; render(); }, 500);
      }
    }, 130);
  }

  var activeAudio = null;
  var WA_PLAY_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  var WA_PAUSE_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';

  function resetAudioWidget(btn, bubble){
    btn.innerHTML = WA_PLAY_ICON;
    if(!bubble) return;
    var dot = bubble.querySelector(".wa-dot");
    if(dot) dot.style.left = "0%";
    bubble.querySelectorAll(".wa-bars span.wa-played").forEach(function(s){ s.classList.remove("wa-played"); });
    var timeEl = bubble.querySelector('[data-role="audio-time"]');
    if(timeEl) timeEl.textContent = timeEl.getAttribute("data-original-len") || timeEl.textContent;
  }

  function toggleAudio(btn){
    var src = btn.getAttribute("data-src");
    var bubble = btn.closest(".wa-bubble");
    var barsContainer = bubble ? bubble.querySelector(".wa-bars") : null;
    var bars = barsContainer ? Array.prototype.slice.call(barsContainer.querySelectorAll("span:not(.wa-dot)")) : [];
    var dot = barsContainer ? barsContainer.querySelector(".wa-dot") : null;
    var timeEl = bubble ? bubble.querySelector('[data-role="audio-time"]') : null;

    if(activeAudio && activeAudio._srcKey === src && !activeAudio.paused){
      activeAudio.pause();
      btn.innerHTML = WA_PLAY_ICON;
      return;
    }
    if(activeAudio){
      activeAudio.pause();
      if(activeAudio._btn && activeAudio._bubble) resetAudioWidget(activeAudio._btn, activeAudio._bubble);
    }

    activeAudio = new Audio(src);
    activeAudio._srcKey = src;
    activeAudio._btn = btn;
    activeAudio._bubble = bubble;
    btn.innerHTML = WA_PAUSE_ICON;
    activeAudio.play().catch(function(){});

    activeAudio.addEventListener("timeupdate", function(){
      var t = Math.floor(activeAudio.currentTime);
      var m = Math.floor(t/60), s = t%60;
      if(timeEl) timeEl.textContent = (m<10?"0":"")+m+":"+(s<10?"0":"")+s;

      if(activeAudio.duration && isFinite(activeAudio.duration)){
        var pct = activeAudio.currentTime / activeAudio.duration;
        if(dot) dot.style.left = (pct*100) + "%";
        if(bars.length){
          var playedCount = Math.round(pct * bars.length);
          bars.forEach(function(b, i){ b.classList.toggle("wa-played", i < playedCount); });
        }
      }
    });
    activeAudio.addEventListener("ended", function(){
      resetAudioWidget(btn, bubble);
      activeAudio = null;
    });
  }

  document.addEventListener("click", function(e){
    var t = e.target.closest("[data-action]");
    if(t){
      var action = t.getAttribute("data-action");

      if(action === "start"){ current = 0; render(); return; }

      if(action === "back"){
        if(current > 0){ current--; render(); }
        else if(current === 0){ current = -1; render(); }
        return;
      }

      if(action === "choose"){
        var stp = STEPS[current];
        if(stp && stp.id === "gender"){
          userGender = parseInt(t.getAttribute("data-idx"), 10) || 0;
        }
        current++; render(); return;
      }

      if(action === "toggle"){
        var step = STEPS[current];
        var idx = t.getAttribute("data-idx");
        checkboxState[step.id] = checkboxState[step.id] || {};
        checkboxState[step.id][idx] = !checkboxState[step.id][idx];
        render();
        return;
      }

      if(action === "continue"){
        current++; render(); return;
      }

      if(action === "toggle-audio"){
        toggleAudio(t);
        return;
      }
    }

    var waBtn = e.target.closest("[data-wa]");
    if(waBtn){
      var idx2 = waBtn.getAttribute("data-wa");
      var slides = document.querySelectorAll(".wa-slide");
      var dots = document.querySelectorAll(".wa-dots button");
      slides.forEach(function(s,i){ s.classList.toggle("active", i==idx2); });
      dots.forEach(function(d,i){ d.classList.toggle("active", i==idx2); });
    }
  });

  render();
})();
</script>
